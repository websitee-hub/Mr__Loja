<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Loja</title>

    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding-bottom: 80px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #020617; border-bottom: 3px solid orange; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 26px; color: #3b82f6; cursor: pointer; font-weight: bold; }
        .login { cursor: pointer; font-size: 24px; background: #1e293b; padding: 5px 12px; border-radius: 50%; }

        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }

        .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; background: #0f172a; }
        .card h4 { margin: 10px 0 5px; }

        .preco { color: orange; font-weight: bold; font-size: 1.2rem; margin: 5px 0; }

        button { background: #3b82f6; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-excluir { background: #ef4444; margin-top: 5px; width: 100%; }

        .admin-box { display: none; background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 2px dashed #3b82f6; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #334155; border-radius: 5px; background: #0f172a; color: #fff; box-sizing: border-box; }

        /* Carrinho */
        .cart { position: fixed; bottom: 20px; right: 20px; background: orange; color: #000; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; }
        .cartBox { position: fixed; bottom: 85px; right: 20px; background: #1e293b; padding: 15px; border-radius: 12px; width: 280px; display: none; border: 1px solid orange; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 1000; }
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .btn-remove { background: #ef4444; padding: 2px 8px; font-size: 12px; margin-left: 5px; }
    </style>
</head>

<body>

<header>
    <div class="logo" id="logoMain">🚗 MR Loja</div>
    <div class="login" onclick="loginGoogle()">👤</div>
</header>

<div class="container">
    <div id="adminBox" class="admin-box">
        <h3>Painel do Administrador</h3>
        <input id="nomeInput" placeholder="Nome do Produto">
        <input id="precoInput" type="number" placeholder="Preço (Ex: 50.00)">
        <input id="imagemInput" placeholder="URL da Imagem">
        <button onclick="addProduto()" style="width: 100%;">Adicionar Produto</button>
    </div>

    <div id="lista" class="produtos">
        </div>
</div>

<div class="cart" onclick="toggleCart()">🛒 R$ <span id="total">0.00</span></div>

<div id="cartBox" class="cartBox">
    <h4 style="margin-top:0">Seu Pedido</h4>
    <div id="itensCarrinho"></div>
    <hr>
    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px">
        <span>Total:</span>
        <span id="totalCarrinho">R$ 0.00</span>
    </div>
    <button onclick="finalizar()" style="width:100%; background: #22c55e;">Finalizar no WhatsApp</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvaF-ppTlCkglojighky9LtsUoanZS_kI",
        authDomain: "mr-loja-4545.firebaseapp.com",
        projectId: "mr-loja-4545"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const ADM_EMAILS = [
        "lojamr.auto@gmail.com",
        "arthurfigueiredo017@gmail.com"
    ];

    let user = null;
    let admin = false;
    let produtos = [];
    let carrinho = [];

    // --- AUTENTICAÇÃO ---
    window.loginGoogle = async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("Erro login:", error);
        }
    };

    onAuthStateChanged(auth, (u) => {
        user = u;
        if (u && ADM_EMAILS.includes(u.email.toLowerCase())) {
            admin = true;
        } else {
            admin = false;
        }
        updateUI();
    });

    // --- FUNÇÕES DE PRODUTO ---
    window.addProduto = async () => {
        const nome = document.getElementById("nomeInput").value.trim();
        const preco = Number(document.getElementById("precoInput").value);
        const imagem = document.getElementById("imagemInput").value.trim();

        if (!nome || !preco || !imagem) return alert("Preencha todos os campos!");

        await addDoc(collection(db, "produtos"), { nome, preco, imagem });
        
        document.getElementById("nomeInput").value = "";
        document.getElementById("precoInput").value = "";
        document.getElementById("imagemInput").value = "";
        alert("Produto adicionado!");
    };

    window.excluir = async (id) => {
        if (confirm("Deseja apagar este produto do catálogo?")) {
            await deleteDoc(doc(db, "produtos", id));
        }
    };

    // --- FUNÇÕES DO CARRINHO ---
    window.addCarrinho = (nome, preco) => {
        const item = carrinho.find(p => p.nome === nome);
        if (item) {
            item.qtd++;
        } else {
            carrinho.push({ nome, preco: Number(preco), qtd: 1 });
        }
        renderCart();
    };

    window.removerDoCarrinho = (index) => {
        if (carrinho[index].qtd > 1) {
            carrinho[index].qtd--;
        } else {
            carrinho.splice(index, 1);
        }
        renderCart();
    };

    window.toggleCart = () => {
        const box = document.getElementById("cartBox");
        box.style.display = box.style.display === "block" ? "none" : "block";
    };

    function renderCart() {
        const container = document.getElementById("itensCarrinho");
        const totalEl = document.getElementById("total");
        const totalBoxEl = document.getElementById("totalCarrinho");
        let total = 0;

        container.innerHTML = "";

        carrinho.forEach((p, index) => {
            total += p.preco * p.qtd;
            container.innerHTML += `
            <div class="item-carrinho">
                <div>
                    <span>${p.nome}</span><br>
                    <small>${p.qtd}x R$ ${p.preco.toFixed(2)}</small>
                </div>
                <button class="btn-remove" onclick="removerDoCarrinho(${index})">Remover</button>
            </div>`;
        });

        if (carrinho.length === 0) container.innerHTML = "<p>Carrinho vazio</p>";

        totalEl.innerText = total.toFixed(2);
        totalBoxEl.innerText = "R$ " + total.toFixed(2);
    }

    window.finalizar = () => {
        if (carrinho.length === 0) return alert("Seu carrinho está vazio!");
        if (!user) return alert("Faça login clicando no ícone de usuário para pedir.");

        let msg = `*Novo Pedido - MR Loja*\n\n`;
        msg += `*Cliente:* ${user.displayName}\n`;
        msg += `--------------------------\n`;
        
        let total = 0;
        carrinho.forEach(p => {
            msg += `• ${p.nome} (${p.qtd}x) - R$ ${(p.preco * p.qtd).toFixed(2)}\n`;
            total += p.preco * p.qtd;
        });

        msg += `\n*Total: R$ ${total.toFixed(2)}*`;
        
        const tel = "5571991813374";
        window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`);
    };

    // --- INTERFACE ---
    function updateUI() {
        document.getElementById("adminBox").style.display = admin ? "block" : "none";
        renderLoja();
    }

    function renderLoja() {
        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        produtos.forEach(p => {
            lista.innerHTML += `
            <div class="card">
                <img src="${p.imagem}" alt="${p.nome}">
                <h4>${p.nome}</h4>
                <p class="preco">R$ ${Number(p.preco).toFixed(2)}</p>
                <button onclick="addCarrinho('${p.nome}','${p.preco}')" style="width:100%">Comprar</button>
                ${admin ? `<button class="btn-excluir" onclick="excluir('${p.id}')">Excluir</button>` : ""}
            </div>`;
        });
    }

    // Escuta mudanças no banco do Firebase
    onSnapshot(collection(db, "produtos"), (snap) => {
        produtos = [];
        snap.forEach(d => produtos.push({ ...d.data(), id: d.id }));
        renderLoja();
    });
</script>

</body>
</html>
